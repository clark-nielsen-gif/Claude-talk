# Fast checks on every push: engine unit/property tests and the real-time
# allocation test on Windows. (Repository is private: windows-latest only;
# the full Windows matrix runs at milestones via workflow_dispatch.)
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'ci/driver-proof/**', '.github/workflows/driver-proof.yml']
  workflow_dispatch:
    inputs:
      matrix:
        description: 'Run on all Windows versions (milestone)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.matrix && '["windows-latest","windows-2025","windows-2022"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      PROPTEST_CASES: 256
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0   # same as rust-toolchain.toml
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: |
          cargo clippy -p ct-engine -p ct-audiotest --all-targets -- -D warnings
          cargo clippy -p claude-talk --all-targets -- -D warnings
      - name: Unit, property and real-time tests
        run: cargo test -p ct-engine --release -- --nocapture

  ui:
    name: UI (types, screenshots, Claude bridge in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # screenshots are published to a ci-results/* branch
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Types and build
        working-directory: app
        run: |
          npx tsc --noEmit -p .
          npm run build
      - name: Screenshots and bridge tests
        working-directory: app
        env: { SHOT_DIR: '../results/screenshots' }
        run: |
          mkdir -p ../results/screenshots
          npx playwright test
      - name: Publish screenshots
        if: always()
        shell: pwsh
        run: ci/publish-results.ps1 -Folder results -Job 'ui'
