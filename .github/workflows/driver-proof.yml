# Milestone 0: prove the virtual-device foundation on real Windows runners
# before anything else is built.
#   A) VirtualDrivers "Virtual Audio Driver" (MIT), signed release 25.7.14
#   B) Official VB-Audio VB-CABLE + Hi-Fi Cable, downloaded from vb-audio.com
#
# Hosted runners boot with test signing ON (image default, cannot be changed
# without a reboot), so "it installed" proves nothing. Production signing is
# proven from the signature chain of the packages Windows actually installed
# (signtool verify /kp + Microsoft/legacy cross-signed chain).
name: driver-proof

on:
  workflow_dispatch:
  push:
    paths: ['ci/driver-proof/**', 'ci/publish-results.ps1', '.github/workflows/driver-proof.yml']

permissions:
  contents: write   # results are published to ci-results/* branches

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  virtualdrivers:
    name: A · VirtualDrivers signed
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download signed release 25.7.14
        shell: powershell
        run: |
          New-Item -ItemType Directory results | Out-Null
          gh release download 25.7.14 -R VirtualDrivers/Virtual-Audio-Driver -D vad
          Get-ChildItem vad -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath vad\x -Force }
          Get-ChildItem vad -Recurse -Include *.inf, *.sys, *.cat | Format-Table FullName, Length
      - name: Kernel-mode signature proof
        shell: powershell
        run: ci/driver-proof/Assert-KernelSignature.ps1 -Path vad -OutFile results\signature-A.json -NoThrow
      - name: Target OS range in INF
        shell: powershell
        run: Select-String -Path (Get-ChildItem vad -Recurse -Filter *.inf).FullName -Pattern 'NT\$?(ARCH|amd64)' | ForEach-Object Line
      - name: Publish results
        if: always()
        shell: powershell
        run: ci/publish-results.ps1 -Folder results -Job 'A-virtualdrivers'

  vbaudio:
    name: B · VB-CABLE + Hi-Fi Cable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Baseline report
        shell: powershell
        run: |
          New-Item -ItemType Directory results | Out-Null
          ci/driver-proof/Report-Audio.ps1 -OutFile results\01-baseline.json -Label baseline

      - name: Download official packages from vb-audio.com
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack46.zip -OutFile cable.zip
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/HiFiCableAsioBridgeSetup_v1007.zip -OutFile hifi.zip
          Get-FileHash cable.zip, hifi.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Tee-Object results\sha256.txt
          Expand-Archive cable.zip -DestinationPath vb\cable -Force
          Expand-Archive hifi.zip -DestinationPath vb\hifi -Force
          Copy-Item vb\cable\vbMmeCable64_win10.inf, vb\cable\readme.txt results\
          Get-Content vb\cable\vbMmeCable64_win10.inf | Select-String -Pattern 'Manufacturer|NTamd64|ROOT\\|FriendlyName|szPname|DriverVer|Desc' | ForEach-Object Line

      - name: Install VB-CABLE silently, NO publisher pre-trust (detects a hidden driver dialog)
        id: cable
        timeout-minutes: 4
        continue-on-error: true
        shell: powershell
        run: |
          $p = Start-Process vb\cable\VBCABLE_Setup_x64.exe -ArgumentList '-i', '-h' -Wait -PassThru
          "VB-CABLE setup exit=$($p.ExitCode)" | Tee-Object results\cable-install.txt

      - name: Report after VB-CABLE
        if: always()
        shell: powershell
        run: |
          Start-Sleep 5
          "cable step outcome=${{ steps.cable.outcome }}" | Tee-Object -Append results\cable-install.txt
          ci/driver-proof/Report-Audio.ps1 -OutFile results\02-after-cable.json -Label after-cable

      - name: Hi-Fi Cable – attempt 1, no pre-trust (recorded with screenshots)
        shell: powershell
        run: ci/driver-proof/Watch-Installer.ps1 -Exe vb\hifi\HiFiCableAsioBridgeSetup.exe -Arguments '-i','-h' -OutDir results -Name hifi-1 | Tee-Object results\hifi-install.txt

      - name: Hi-Fi Cable – attempt 2, installer signer pre-trusted
        shell: powershell
        run: |
          $cert = (Get-AuthenticodeSignature vb\hifi\HiFiCableAsioBridgeSetup.exe).SignerCertificate
          "Trusting publisher for this runner only: $($cert.Subject)"
          $store = New-Object Security.Cryptography.X509Certificates.X509Store 'TrustedPublisher', 'LocalMachine'
          $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          ci/driver-proof/Watch-Installer.ps1 -Exe vb\hifi\HiFiCableAsioBridgeSetup.exe -Arguments '-i','-h' -OutDir results -Name hifi-2 | Tee-Object -Append results\hifi-install.txt

      - name: Report after Hi-Fi Cable
        if: always()
        shell: powershell
        run: |
          Start-Sleep 5
          ci/driver-proof/Report-Audio.ps1 -OutFile results\03-after-hifi.json -Label after-hifi
          ci/driver-proof/List-Endpoints.ps1 -OutFile results\04-endpoints-before-rename.json | Out-Null

      - name: Signature proof of the packages Windows installed
        if: always()
        shell: powershell
        run: |
          pnputil /enum-drivers | Out-String | Tee-Object results\pnputil-drivers.txt | Out-Null
          $repo = "$env:SystemRoot\System32\DriverStore\FileRepository"
          $dirs = Get-ChildItem $repo -Directory | Where-Object {
            Get-ChildItem $_.FullName -Filter *.inf | Select-String -Pattern 'VB-Audio|Burel' -Quiet
          }
          "VB-Audio packages in DriverStore:"; $dirs.FullName
          ci/driver-proof/Assert-KernelSignature.ps1 -Path $dirs.FullName -OutFile results\05-signature-installed.json

      - name: Rename capture endpoints to the product names
        if: always()
        shell: powershell
        run: |
          $m1 = ci/driver-proof/Rename-Endpoint.ps1 -Flow Capture -MatchFriendlyName 'CABLE Output' -NewDeviceDesc 'Claude Talk – til Discord' -NewInterface 'Claude Talk'
          $m2 = 'not-run'
          if (ci/driver-proof/List-Endpoints.ps1 | Where-Object { $_.Flow -eq 'Capture' -and $_.FriendlyName -match 'Hi-Fi' }) {
            $m2 = ci/driver-proof/Rename-Endpoint.ps1 -Flow Capture -MatchFriendlyName 'Hi-Fi' -NewDeviceDesc 'Claude Talk – til Claude' -NewInterface 'Claude Talk'
          }
          "discord-mic method=$m1`nclaude-mic method=$m2" | Tee-Object results\rename-method.txt

      - name: Verify names as apps see them
        if: always()
        shell: powershell
        run: |
          $rows = ci/driver-proof/List-Endpoints.ps1 -OutFile results\06-endpoints-after-rename.json
          $cap = @($rows | Where-Object Flow -eq 'Capture' | ForEach-Object FriendlyName)
          $ok = $true
          foreach ($want in 'Claude Talk – til Discord', 'Claude Talk – til Claude') {
            $hit = $cap | Where-Object { $_ -like "$want*" } | Select-Object -First 1
            if ($hit) { "FOUND   '$want' as '$hit'" } else { "MISSING '$want'"; $ok = $false }
          }
          $cap | Set-Content -Encoding utf8 results\capture-names.txt
          if (-not $ok) { throw 'Two renamed virtual microphones were not found.' }

      - name: Publish results
        if: always()
        shell: powershell
        run: ci/publish-results.ps1 -Folder results -Job 'B-${{ matrix.os }}'
