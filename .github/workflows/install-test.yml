# Builds the real installer (as the release does, unsigned) and tests a
# silent install, the virtual microphone, start-up performance and a clean
# uninstall on a fresh runner.
name: install-test

on:
  push:
    branches: [main]
    paths: ['app/**', 'engine/**', 'ci/install-test.ps1', '.github/workflows/install-test.yml', 'Cargo.*']
  workflow_dispatch:

permissions:
  contents: write   # results are published to ci-results/* branches

env:
  GITHUB_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: always

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Build installer
        working-directory: app
        shell: powershell
        run: |
          npm ci
          npx tauri build -- --profile ci
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }
      - name: Install, start, uninstall
        shell: powershell
        run: |
          $setup = Get-ChildItem target -Recurse -Filter '*-setup.exe' | Where-Object FullName -like '*bundle\nsis*' | Select-Object -First 1
          if (-not $setup) { throw 'installer not found' }
          Write-Host "Installer: $($setup.FullName) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          ci/install-test.ps1 -Setup $setup.FullName -Out results
          if ($LASTEXITCODE -ne 0) { throw 'install test failed' }
      - name: Publish results
        if: always()
        shell: powershell
        run: ci/publish-results.ps1 -Folder results -Job 'install-test'
