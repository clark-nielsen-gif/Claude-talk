# Real-device audio tests on Windows: engine render/capture through the
# virtual cable, process-loopback isolation and recovery after a program
# restart. (Later milestones add the full frequency-isolation test with the
# Claude window.)
name: audio-e2e

on:
  push:
    branches: [main]
    paths: ['engine/**', 'tools/**', 'ci/fixtures/**', '.github/workflows/audio-e2e.yml', 'Cargo.*']
  workflow_dispatch:

permissions:
  contents: write   # results are published to ci-results/* branches

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: always

concurrency:
  group: audio-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build test tool
        run: cargo build -p ct-audiotest --profile ci
      - name: Install VB-CABLE (as the product does)
        shell: powershell
        run: ci/fixtures/install-vbcable.ps1
      - name: Install CI test sink
        shell: powershell
        run: ci/fixtures/install-test-sink.ps1
      - name: VB-CABLE settings (information)
        shell: powershell
        continue-on-error: true
        run: |
          # Where VB-CABLE keeps its internal latency ("Max Latency"), to
          # decide whether the installer should set it (KNOWN_ISSUES K9).
          New-Item -ItemType Directory results -Force | Out-Null
          $o = @()
          foreach ($k in 'HKLM\SOFTWARE\VB-Audio', 'HKLM\SOFTWARE\WOW6432Node\VB-Audio', 'HKCU\Software\VB-Audio') { $o += "== $k"; $o += (reg query $k /s 2>&1) }
          $svc = Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services' | Where-Object { $_.PSChildName -like 'VBAudio*' }
          foreach ($x in $svc) { $o += "== $($x.Name)"; $o += (reg query $x.Name /s 2>&1) }
          $class = 'HKLM\SYSTEM\CurrentControlSet\Control\Class\{4d36e96c-e325-11ce-bfc1-08002be10318}'
          foreach ($x in Get-ChildItem "Registry::$class" -ErrorAction SilentlyContinue) {
            if ((Get-ItemProperty $x.PSPath -ErrorAction SilentlyContinue).DriverDesc -like '*VB-Audio*') { $o += "== $($x.Name)"; $o += (reg query $x.Name /s 2>&1) }
          }
          $cp = Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter 'VBCABLE_ControlPanel.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cp) {
            $bytes = [IO.File]::ReadAllBytes($cp.FullName)
            $u = [Text.Encoding]::Unicode.GetString($bytes); $a = [Text.Encoding]::ASCII.GetString($bytes)
            $o += '--- control panel strings ---'
            $o += [regex]::Matches($u + "`n" + $a, '[ -~]{6,}') | ForEach-Object Value | Where-Object { $_ -match 'atency|SOFTWARE|System\\|Registry|VBAudio|Buffer|IOCTL' } | Select-Object -Unique -First 80
          }
          $o | Set-Content -Encoding utf8 results/vbcable-settings.txt
          $o | Write-Host
      - name: Devices
        shell: powershell
        run: target/ci/ct-audiotest.exe devices | Tee-Object results/devices.json
      - name: Smoke test
        shell: powershell
        run: |
          target/ci/ct-audiotest.exe smoke --cable-in 'CABLE Input' --cable-out 'Claude Talk' --sink 'Virtual Audio' --out results/smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
      - name: Publish results
        if: always()
        shell: powershell
        run: ci/publish-results.ps1 -Folder results -Job 'audio-smoke'
