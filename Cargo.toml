[workspace]
resolver = "2"
members = ["engine", "tools/audiotest", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Faster optimised builds for CI tests (release keeps LTO for size/speed).
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
