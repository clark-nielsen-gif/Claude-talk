[package]
name = "claude-talk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude Talk – bring Claude into your Discord calls"
default-run = "claude-talk"

[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]
# set by `tauri build`; needed for plain `cargo build` of a release binary
custom-protocol = ["tauri/custom-protocol"]
# Hidden test mode for CI only: lets the Claude window load the local test
# page instead of claude.ai. Never enabled in release builds.
ci-testpage = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ct-engine = { path = "../../engine" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media", "Win32_System_Com_Urlmon", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_UI_Shell"] }
webview2-com = "0.39"
